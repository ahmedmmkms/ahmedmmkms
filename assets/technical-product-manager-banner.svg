<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ahmed Sadek — Systems Engineer × Product Manager</title>
  <desc id="description">Complex systems. Clear decisions. A feedback loop connects the user problem, system model, product decision, and measured signal.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#244052" stroke-opacity="0.35"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="#58D7C8"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="20" fill="#0B1724"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="19" stroke="#294252"/>
  <rect x="48" y="48" width="4" height="243" rx="2" fill="#58D7C8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="77" fill="#58D7C8" font-size="15" font-weight="700" letter-spacing="2">SYSTEMS ENGINEER × PRODUCT MANAGER</text>
    <text x="72" y="150" fill="#F2F6FA" font-size="55" font-weight="700" letter-spacing="-1.4">Ahmed Sadek</text>
    <text x="76" y="202" fill="#F2F6FA" font-size="25" font-weight="700">Complex systems. Clear decisions.</text>
    <text x="76" y="251" fill="#B5C6D2" font-size="18">User needs → technical trade-offs → product value</text>
    <text x="76" y="288" fill="#8CA6B9" font-size="14" letter-spacing="1">AI / SOFTWARE   ·   CYBER-PHYSICAL SYSTEMS   ·   PRODUCT STRATEGY</text>
    <text x="792" y="55" fill="#8CA6B9" font-size="12" font-weight="700" letter-spacing="2">THE DECISION LOOP</text>
    <g stroke="#58D7C8" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M887 111H934"/>
      <path d="M1026 150V189"/>
      <path d="M936 229H889"/>
      <path d="M797 190V151"/>
    </g>
    <rect x="705" y="75" width="182" height="75" rx="10" fill="#112B35" stroke="#39636A"/>
    <rect x="936" y="75" width="182" height="75" rx="10" fill="#142737" stroke="#39636A"/>
    <rect x="936" y="191" width="182" height="75" rx="10" fill="#142737" stroke="#39636A"/>
    <rect x="705" y="191" width="182" height="75" rx="10" fill="#322C22" stroke="#87744C"/>
    <g fill="#F2F6FA" font-size="17" font-weight="700" text-anchor="middle">
      <text x="796" y="106">User problem</text>
      <text x="1027" y="106">System model</text>
      <text x="1027" y="222">Product decision</text>
      <text x="796" y="222">Measured signal</text>
    </g>
    <g fill="#B5C6D2" font-size="12" text-anchor="middle">
      <text x="796" y="129">Evidence &amp; context</text>
      <text x="1027" y="129">Needs &amp; constraints</text>
      <text x="1027" y="245">Scope &amp; trade-offs</text>
      <text x="796" y="245">Validate &amp; learn</text>
    </g>
    <text x="912" y="300" fill="#8CA6B9" font-size="12" text-anchor="middle">Connect the whole system. Close the feedback loop.</text>
  </g>
</svg>
